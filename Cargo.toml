# AudioWhisper's shared text rules in Rust, used by the Mac app (as a static library, through
# awcore's C interface) and by the Android keyboard (as a crate in its cargo workspace).
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.98"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
