name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # macOS: the Unicode tables come from macOS, and the library is built for it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Universal library
        run: tools/build-macos.sh target/universal && lipo -archs target/universal/libawcore.a
